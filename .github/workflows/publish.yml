name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'jagreehal'
    environment: release
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC) — no long-lived token
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        # Docker-based action: GitHub pulls ghcr.io/pypa/gh-action-pypi-publish:<sha>
        # literally, so the pin must be a real upstream commit that has a published
        # image, or the run dies with "manifest unknown".
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
