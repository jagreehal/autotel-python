name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Weekly: new advisories land, and unpinned frameworks change, with no code change here.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        # [all] as well as [dev]: the optional extras carry their own version
        # floors, and installing them here is what proves those floors actually
        # resolve on every supported Python.
        run: uv pip install --system -e ".[dev,all]"

      - name: Run linting
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run type checking
        run: mypy src

      # All of tests/, because the integrations are what a framework release breaks.
      - name: Run tests
        run: pytest tests -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Check the package builds
        run: python -m build && python -m twine check dist/*

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install uv pip-audit
      - run: uv export --frozen --all-extras --no-emit-project -o requirements-audit.txt
      - run: pip-audit -r requirements-audit.txt --disable-pip
