[project]
name = "autotel"
dynamic = ["version"]
description = "Write One, Observe Everywhere: OpenTelemetry for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "opentelemetry",
    "observability",
    "tracing",
    "monitoring",
    "telemetry",
    "distributed-tracing",
    "otel",
    "instrumentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "pydantic>=2.14.2",
    "typing-extensions>=4.16.0",
]

[[project.authors]]
name = "Jag Reehal"
email = "jag@jagreehal.com"

[project.urls]
Homepage = "https://github.com/jagreehal/autotel-python"
Documentation = "https://github.com/jagreehal/autotel-python#readme"
Repository = "https://github.com/jagreehal/autotel-python"
Issues = "https://github.com/jagreehal/autotel-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "fastapi>=0.141.1",
    "flask>=3.1.0",
    "django>=5.2",
    "grpcio>=1.84.0",
    "httpx>=0.28.1",
    "build>=1.6.1",
    "twine>=7.0.0",
    "executable-stories-pytest>=0.1.1",
]
fastapi = [
    "fastapi>=0.141.1",
]
django = [
    "django>=5.2",
]
flask = [
    "flask>=3.1.0",
]
grpc = [
    "grpcio>=1.84.0",
]
events = [
    "httpx>=0.28.1",
]
logging = [
    "structlog>=26.1.0",
]
pydantic-ai = [
    "pydantic-ai>=2.54.0",
    "ollama>=0.6.3",
]
all = [
    "autotel[fastapi,django,flask,grpc,events,logging,pydantic-ai]",
]

[tool.uv]
# 2.9.0 fixes CVE-2026-114605 but needs Python 3.11, so 3.10 stays on 2.8.0.
constraint-dependencies = ["dnspython>=2.9.0; python_version >= '3.11'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotel"]

[tool.hatch.version]
path = "src/autotel/__version__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/testing/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

# Tests: allow unused args (fixtures, signature tests, decorator targets)
# Examples/scripts: same reason — decorators supply `ctx`/payload positionally,
# so demo bodies that ignore an argument still need it in the signature.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005"]
"examples/**" = ["ARG001"]
"scripts/**" = ["ARG001"]

[tool.mypy]
python_version = "3.10"
exclude = ["examples/", "scripts/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "flask.*",
    "structlog.*",
    "django.*",
    "grpc.*",
    "traceloop.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101"]  # Skip assert_used (common in tests)
